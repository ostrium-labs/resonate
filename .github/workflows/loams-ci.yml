# The fork's own CI for `loams/main` and the PRs into it (CARRIES.md).
#
# The org's runner concurrency is scarce, so this workflow is lean on
# purpose. The upstream workflows (server-core, server-s3, sdk-rs) are
# disabled on the fork. What runs here:
#
# - `check`: what `cargo xtask check` runs (fmt, check, clippy, tests).
# - `stores`: porcupine linearizability on each store Loams uses that
#   needs a service. Each leg starts its database with `docker run` in a step,
#   so only that leg pays for it, rather than all of them starting in every
#   leg the way `services:` would.
#
# The engine and port differentials on Postgres, MySQL, Neo4j and S3 stay in
# upstream's server-core workflow. Run them locally with
# `cargo xtask differential --backend <b>` when a change touches those stores.
# Contributors are expected to verify locally first. A PR description says
# what was run.

name: loams

on:
  pull_request:
    branches: [loams/main]
    paths:
      - "impl/server/core/**"
      - "spec/valid/porc/**"
      - ".github/workflows/loams-ci.yml"
  push:
    branches: [loams/main]
    paths:
      - "impl/server/core/**"
      - "spec/valid/porc/**"
      - ".github/workflows/loams-ci.yml"
  workflow_dispatch:

concurrency:
  group: loams-${{ github.ref }}
  cancel-in-progress: true

# Pinned, so a new stable's lints do not fail an unrelated PR: Rust 1.99's
# clippy::double_must_use fires inside async-trait's expansion everywhere.
# Bump it on purpose, together with any fixes the new lints ask for.
env:
  RUST_TOOLCHAIN: "1.97.1"

defaults:
  run:
    working-directory: impl/server/core

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
          cache-workspaces: impl/server/core
      - name: Check
        run: cargo xtask check

  stores:
    name: Linearizability (${{ matrix.backend }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        backend: [sqlite, tidb, tikv]
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          cache-workspaces: impl/server/core
      - uses: actions/setup-go@v5
        with:
          go-version-file: spec/valid/porc/go.mod
          cache-dependency-path: spec/valid/porc/go.sum

      # TiDB with its embedded storage (unistore). The SQL layer, the MySQL
      # protocol and pessimistic transactions are TiDB's own, and those are
      # what the mysql plugin is held to.
      - name: Start TiDB
        if: matrix.backend == 'tidb'
        run: |
          docker run -d --name tidb -p 4000:4000 pingcap/tidb:v8.5.8
          for i in $(seq 1 60); do
            (echo > /dev/tcp/127.0.0.1/4000) 2>/dev/null && exit 0
            sleep 2
          done
          docker logs tidb; echo "tidb did not open port 4000"; exit 1

      # PD + TiKV v8.5.8 on API v2 (keyspaces), single node, host network.
      - name: Start TiKV
        if: matrix.backend == 'tikv'
        run: test/tikv/up.sh 2379 20160

      # The TiKV store's own tests: the blob differential on TiKV, the store
      # contract, the on-disk layout and the Loams 0.1.x fixture.
      - name: TiKV store tests
        if: matrix.backend == 'tikv'
        env:
          XTASK_TIKV_PD: 127.0.0.1:2379
        run: cargo xtask differential --backend tikv

      - name: Linearizability
        env:
          XTASK_TIKV_PD: 127.0.0.1:2379
          XTASK_TIDB_ADMIN_URL: mysql://root@127.0.0.1:4000/mysql
          XTASK_SPEC_DIR: ${{ github.workspace }}/spec/valid/porc
        run: cargo xtask porcupine --backend ${{ matrix.backend }}
