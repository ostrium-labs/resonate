# TiKV for Resonate's TiKV store: API v2 (keyspaces), which needs TTL.
memory-usage-limit = "2GB"

[storage]
api-version = 2
enable-ttl = true

[storage.block-cache]
capacity = "512MB"

# TiKV refuses to start when the open-file limit is below what its RocksDB
# instances may open (default 40960 each). CI runners allow 65536; ask for less.
[rocksdb]
max-open-files = 16384

[raftdb]
max-open-files = 16384
