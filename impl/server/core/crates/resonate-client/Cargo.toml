[package]
name = "resonate-client"
description = "A typed Rust client for the Resonate protocol: every promise, task and schedule request, over HTTP to a gateway or in process over a ResonateServer."
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "resonate_client"
path = "src/lib.rs"

[dependencies]
# The vocabulary (records, states, envelopes) and the port this crate both
# calls and implements. Nothing else from the server workspace: a client must
# be buildable without an engine.
resonate-core = { version = "0.10.1", path = "../resonate-core" }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# rustls only, so a client pulls in no system TLS library.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# `rt`: a poll subscription reads its connection on a task of its own.
tokio = { version = "1", features = ["time", "sync", "rt"] }

[dev-dependencies]
# The round trips run against a real server, in process and through the real
# HTTP gateway on a free port.
resonate-server-sqlite = { path = "../resonate-server-sqlite" }
resonate-sql = { path = "../resonate-sql" }
resonate-gateway-http = { path = "../resonate-gateway-http" }
resonate-plugin = { path = "../resonate-plugin" }
resonate-auth = { path = "../resonate-auth" }
# The poll consumer's tests run against the real poll transport.
resonate-transport-http-poll = { path = "../resonate-transport-http-poll" }
validator = { workspace = true }
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
