# Every span the bench produces: to rotated, zstd-compressed JSON files and
# to SigNoz's collector.
receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }
processors:
  batch: { send_batch_size: 8192, timeout: 2s }
exporters:
  file/traces:
    path: /traces/spans.jsonl
    format: json
    compression: zstd
    rotation: { max_megabytes: 200, max_backups: 100 }
  otlp/signoz:
    endpoint: signoz-otel-collector:4317
    tls: { insecure: true }
    sending_queue: { queue_size: 20000 }
service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [file/traces, otlp/signoz]
