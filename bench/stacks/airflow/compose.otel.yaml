# Airflow's spans to the bench collector, which joins this stack's network:
#   podman network connect rbench-airflow_default rbench-otelcol
services:
  airflow-api-server:
    environment:
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://rbench-otelcol:4318/v1/traces
      OTEL_SERVICE_NAME: airflow
  airflow-scheduler:
    environment:
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://rbench-otelcol:4318/v1/traces
      OTEL_SERVICE_NAME: airflow
  airflow-dag-processor:
    environment:
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://rbench-otelcol:4318/v1/traces
      OTEL_SERVICE_NAME: airflow
  airflow-triggerer:
    environment:
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://rbench-otelcol:4318/v1/traces
      OTEL_SERVICE_NAME: airflow
  airflow-edge-worker-1:
    environment:
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://rbench-otelcol:4318/v1/traces
      OTEL_SERVICE_NAME: airflow
  airflow-edge-worker-2:
    environment:
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://rbench-otelcol:4318/v1/traces
      OTEL_SERVICE_NAME: airflow
